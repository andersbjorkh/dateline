<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dateline</title>
<meta name="description" content="The single most important thing that happened on today's date in history, plus every other year that shares it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23123a3d'/%3E%3Cpath d='M7 22h18M9 22V12m5 10V8m5 14v-7m5 7V10' stroke='%23e5b25d' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800;900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
:root {
  --bg: #eef2f1;
  --surface: #f8faf9;
  --ink: #13211f;
  --ink-2: #435451;
  --ink-3: #6f7f7c;
  --rule: #cdd8d5;
  --accent: #0f5f5a;
  --accent-soft: #d5e7e4;
  --brass: #a8741c;
  --brass-soft: #f1e4c8;
  --mark: #9fb3af;
  --shadow: 0 1px 2px rgb(19 33 31 / .06), 0 8px 28px rgb(19 33 31 / .07);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1515;
    --surface: #142120;
    --ink: #e6efed;
    --ink-2: #aebdba;
    --ink-3: #7f918d;
    --rule: #26393a;
    --accent: #5fc2b8;
    --accent-soft: #173634;
    --brass: #e5b25d;
    --brass-soft: #3a2e17;
    --mark: #3f5654;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1515;
  --surface: #142120;
  --ink: #e6efed;
  --ink-2: #aebdba;
  --ink-3: #7f918d;
  --rule: #26393a;
  --accent: #5fc2b8;
  --accent-soft: #173634;
  --brass: #e5b25d;
  --brass-soft: #3a2e17;
  --mark: #3f5654;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.55;
  padding-inline: 16px;
}
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

.wrap { max-width: 1080px; margin-inline: auto; }

/* Top bar: date navigator */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
  margin-inline: -16px;
  padding: 10px 16px;
}
.bar .wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand {
  font-family: var(--display);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-right: auto;
  display: flex; align-items: center; gap: 8px;
}
.brand svg { width: 22px; height: 22px; flex: none; }
.nav { display: flex; align-items: center; gap: 6px; }
.btn {
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: 8px;
  height: 38px;
  min-width: 38px;
  padding: 0 12px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.datepick {
  position: relative;
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .04em;
  text-transform: uppercase;
  min-width: 132px;
}
.datepick input {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%;
}
.lang { display: flex; }
.lang .btn { min-width: 42px; padding: 0 10px; }
.lang .btn:first-child { border-radius: 8px 0 0 8px; }
.lang .btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }

main { padding-block: 28px 64px; }

/* Hero: the headline */
.kicker {
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
}
.kicker .pill {
  background: var(--brass-soft);
  color: var(--brass);
  border-radius: 999px;
  padding: 2px 10px;
  font-weight: 500;
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
  gap: 32px;
  align-items: start;
  margin-top: 14px;
}
.year {
  font-family: var(--display);
  font-weight: 900;
  font-size: clamp(96px, 20vw, 220px);
  line-height: .82;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0;
  display: flex; align-items: baseline; gap: .12em;
  font-variant-numeric: tabular-nums;
}
.year .era { font-size: .32em; font-weight: 800; color: var(--brass); letter-spacing: .04em; }
.ago {
  font-family: var(--mono);
  font-size: 14px;
  color: var(--accent);
  margin-top: 10px;
}
.headline {
  font-size: clamp(22px, 2.6vw, 30px);
  line-height: 1.32;
  font-weight: 500;
  margin: 18px 0 0;
  max-width: 34em;
  text-wrap: pretty;
}
.subject {
  margin-top: 16px;
  font-size: 16px;
  color: var(--ink-2);
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline;
}
.subject a { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip {
  font-family: var(--mono);
  font-size: 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px 10px;
  text-decoration: none;
  color: var(--ink-2);
  background: var(--surface);
}
.chip:hover { color: var(--accent); border-color: var(--accent); }
.plate {
  margin: 0;
  background: var(--surface);
  border-radius: 14px;
  padding: 10px;
  box-shadow: var(--shadow);
  transform: rotate(1.2deg);
}
.plate img {
  display: block;
  width: 100%;
  max-height: 380px;
  object-fit: cover;
  border-radius: 8px;
  background: var(--accent-soft);
}
.plate figcaption {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  padding: 8px 4px 2px;
  letter-spacing: .02em;
}

/* Timeline ruler */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin-top: 56px;
  border-top: 2px solid var(--ink);
  padding-top: 12px;
}
.section-head h2 {
  font-family: var(--display);
  font-weight: 800;
  font-size: 28px;
  letter-spacing: .04em;
  text-transform: uppercase;
  margin: 0;
}
.section-head p { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
.ruler-box { overflow-x: auto; margin-top: 16px; }
.ruler { position: relative; height: 92px; min-width: 640px; }
.ruler .axis { position: absolute; left: 0; right: 0; top: 54px; height: 1px; background: var(--ink-2); }
.ruler .tick { position: absolute; top: 54px; width: 1px; height: 8px; background: var(--ink-2); }
.ruler .tlabel {
  position: absolute; top: 66px; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap;
}
.ruler .ev {
  position: absolute; bottom: 38px; width: 3px; margin-left: -1.5px;
  background: var(--mark); border: 0; padding: 0; cursor: pointer; border-radius: 2px;
  transition: background .15s, transform .15s;
}
.ruler .ev:hover, .ruler .ev:focus-visible { background: var(--accent); transform: scaleX(1.8); }
.ruler .ev.top { background: var(--brass); width: 5px; margin-left: -2.5px; }
.ruler .flag {
  position: absolute; top: 0; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11px; font-weight: 500;
  color: var(--brass); white-space: nowrap;
}

/* Event list */
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.list { list-style: none; margin: 18px 0 0; padding: 0; }
.century {
  font-family: var(--display);
  font-weight: 800;
  font-size: 18px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 26px 0 6px;
  display: flex; align-items: center; gap: 12px;
}
.century::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.row {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr) 118px;
  gap: 16px;
  padding: 12px 10px;
  border-radius: 10px;
  align-items: start;
  scroll-margin-top: 90px;
}
.row:target, .row.flash { background: var(--accent-soft); }
.row.is-top { background: var(--brass-soft); }
.row .y {
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  padding-top: 2px;
}
.row .y small { font-size: 13px; color: var(--brass); margin-left: 2px; }
.row .t { font-size: 17px; line-height: 1.5; }
.row .t a { color: inherit; text-decoration-color: var(--rule); }
.row .t a:hover { text-decoration-color: var(--accent); }
.row .badge {
  display: inline-block;
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--brass); margin-right: 6px;
}
.reach { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 6px; }
.reach .meter { height: 4px; background: var(--rule); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.reach .meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.promote {
  border: 0; background: none; padding: 0; margin-top: 6px; cursor: pointer;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px;
}
.promote:hover { color: var(--accent); }

footer {
  border-top: 1px solid var(--rule);
  margin-top: 56px;
  padding-top: 16px;
  font-size: 14px;
  color: var(--ink-3);
}
footer p { margin: 0 0 8px; max-width: 60em; }
.status { font-family: var(--mono); font-size: 14px; color: var(--ink-3); padding: 60px 0; }

@media (max-width: 760px) {
  body { font-size: 17px; }
  .hero { grid-template-columns: 1fr; gap: 22px; }
  .plate { max-width: 360px; transform: rotate(.8deg); }
  .row { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 6px; }
  .row .y { font-size: 22px; }
  .reach { grid-column: 2; padding-top: 0; }
  .brand span { display: none; }
  /* Brand and language share the first row; the date navigator wraps below. */
  .brand { order: -2; }
  .lang { order: -1; }
  .row { scroll-margin-top: 130px; }
  .datepick { min-width: 118px; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero-in { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--accent)"/><path d="M7 22h18M9 22V12m5 10V8m5 14v-7m5 7V10" stroke="var(--brass)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>Dateline</span>
    </div>
    <div class="nav">
      <button class="btn" id="prev" type="button" aria-label="Previous day" data-i18n-aria="prev"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
      <label class="btn datepick" id="dateLabel">
        <span id="dateText">—</span>
        <input type="date" id="dateInput" aria-label="Choose a date" data-i18n-aria="pick">
      </label>
      <button class="btn" id="next" type="button" aria-label="Next day" data-i18n-aria="next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
      <button class="btn" id="today" type="button" data-i18n="today">Today</button>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Language" data-i18n-aria="langAria">
      <button class="btn" type="button" data-lang="en" lang="en" title="English" aria-pressed="true">EN</button>
      <button class="btn" type="button" data-lang="no" lang="nb" title="Norsk" aria-pressed="false">NO</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status" data-i18n="loading">Loading the almanac…</div>

  <section id="heroSec" hidden>
    <div class="kicker">
      <span class="pill" id="kDate">—</span>
      <span id="kNote"></span>
    </div>
    <div class="hero hero-in" id="hero">
      <div>
        <h1 class="year" id="hYear">—</h1>
        <div class="ago" id="hAgo"></div>
        <p class="headline" id="hText"></p>
        <div class="subject" id="hSubject"></div>
        <div class="chips" id="hLinks"></div>
      </div>
      <figure class="plate" id="hPlate" hidden>
        <img id="hImg" alt="">
        <figcaption id="hCap"></figcaption>
      </figure>
    </div>
  </section>

  <section id="rulerSec" hidden>
    <div class="section-head">
      <h2 data-i18n="everyYear">Every year on this date</h2>
      <p id="rulerNote"></p>
    </div>
    <div class="ruler-box"><div class="ruler" id="ruler" role="group" aria-label="Events on this date placed on a timeline" data-i18n-aria="rulerAria"></div></div>
  </section>

  <section id="listSec" hidden>
    <div class="section-head">
      <h2 data-i18n="record">The record</h2>
      <div class="tools" role="group" aria-label="Filter and sort" data-i18n-aria="toolsAria">
        <button class="btn" type="button" id="fCurated" aria-pressed="false" data-i18n="curatedOnly">Curated only</button>
        <button class="btn" type="button" id="sOld" aria-pressed="true" data-i18n="oldest">Oldest first</button>
        <button class="btn" type="button" id="sNew" aria-pressed="false" data-i18n="newest">Newest first</button>
      </div>
    </div>
    <ol class="list" id="list"></ol>
  </section>

  <footer id="footer"></footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const cache = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // Interface strings. Event text comes from English Wikipedia in both
  // languages; in Norwegian, article links point to no.wikipedia.org when an
  // article exists there.
  const I18N = {
    en: {
      locale: "en",
      months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
      date: (m, d) => `${I18N.en.months[m - 1]} ${d}`,
      dateShort: (m, d) => `${I18N.en.months[m - 1].slice(0, 3)} ${d}`,
      bc: "BC", ad: "AD", tickZero: "AD 1",
      prev: "Previous day", next: "Next day", pick: "Choose a date", today: "Today",
      langAria: "Language",
      loading: "Loading the almanac…",
      loadError: "Couldn't load this month's events. Check your connection and reload the page.",
      kickerPick: "The most important thing that happened on this date",
      kickerYours: "Your pick for this date",
      thisYear: "This year",
      ago: (n, s) => (n === 1 ? "1 year ago" : `${s} years ago`),
      read: "Read:",
      wpLangs: (n) => `${n} Wikipedia languages`,
      langs: (n) => `${n} languages`,
      everyYear: "Every year on this date",
      rulerAria: "Events on this date placed on a timeline",
      rulerNote: (n, from, to) => `${n} events, ${from} to ${to} · taller marks = covered in more languages`,
      record: "The record",
      toolsAria: "Filter and sort",
      curatedOnly: "Curated only", oldest: "Oldest first", newest: "Newest first",
      headline: "Headline", curated: "Curated",
      makeHeadline: "Make headline", restorePick: "Restore pick",
      century(y) {
        const ordinal = (n) => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
        if (y < 0) return `${ordinal(Math.floor((-y - 1) / 100) + 1)} century BC`;
        return `${ordinal(Math.floor((y - 1) / 100) + 1)} century`;
      },
      footer: `<p>Events come from Wikipedia's “On this day” feed. The headline for each date is an editorial pick from the day's best-covered events; “languages” counts how many Wikipedia editions have an article on the event's main subject. Text is available under <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a>; images come from Wikimedia Commons, and each links to its article.</p>
        <p>Link to any date by adding it to the address, for example <a href="#07-20">#07-20</a>.</p>`,
    },
    no: {
      locale: "nb-NO",
      months: ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"],
      date: (m, d) => `${d}. ${I18N.no.months[m - 1]}`,
      dateShort: (m, d) => `${d}. ${I18N.no.months[m - 1].slice(0, 3)}`,
      bc: "f.Kr.", ad: "e.Kr.", tickZero: "1 e.Kr.",
      prev: "Forrige dag", next: "Neste dag", pick: "Velg dato", today: "I dag",
      langAria: "Språk",
      loading: "Henter almanakken…",
      loadError: "Kunne ikke hente hendelsene for denne måneden. Sjekk tilkoblingen og last inn siden på nytt.",
      kickerPick: "Det viktigste som skjedde på denne datoen",
      kickerYours: "Ditt valg for denne datoen",
      thisYear: "I år",
      ago: (n, s) => `for ${s} år siden`,
      read: "Les:",
      wpLangs: (n) => `${n} Wikipedia-språk`,
      langs: (n) => `${n} språk`,
      everyYear: "Hvert år på denne datoen",
      rulerAria: "Hendelser på denne datoen plassert på en tidslinje",
      rulerNote: (n, from, to) => `${n} hendelser, ${from} til ${to} · høyere streker = omtalt på flere språk`,
      record: "Arkivet",
      toolsAria: "Filtrer og sorter",
      curatedOnly: "Bare utvalgte", oldest: "Eldste først", newest: "Nyeste først",
      headline: "Hovedsak", curated: "Utvalgt",
      makeHeadline: "Gjør til hovedsak", restorePick: "Gjenopprett valget",
      // Norwegian counts centuries by their hundreds: 1969 is in "1900-tallet".
      century: (y) => (y < 0 ? `${Math.floor(-y / 100) * 100}-tallet f.Kr.` : `${Math.floor(y / 100) * 100}-tallet`),
      footer: `<p>Hendelsene kommer fra Wikipedias «On this day»-feed og står på engelsk. Lenkene går til norsk Wikipedia når artikkelen finnes der. Hovedsaken for hver dato er håndplukket blant dagens best dekkede hendelser; «språk» teller hvor mange Wikipedia-utgaver som har en artikkel om hendelsens hovedtema. Teksten er tilgjengelig under <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.no" rel="noopener">CC BY-SA 4.0</a>; bildene kommer fra Wikimedia Commons og lenker til sin artikkel.</p>
        <p>Lenk til en hvilken som helst dato ved å legge den til adressen, for eksempel <a href="#07-20">#07-20</a>.</p>`,
    },
  };
  const initialLang = () => {
    const saved = store.get("dl.lang");
    if (saved === "en" || saved === "no") return saved;
    return /^(nb|nn|no)\b/i.test(navigator.language || "") ? "no" : "en";
  };

  const state = {
    m: 1, d: 1,
    lang: initialLang(),
    curatedOnly: store.get("dl.curated") === "1",
    newestFirst: store.get("dl.newest") === "1",
    promoted: null,
  };
  const T = () => I18N[state.lang];
  const now = new Date();
  const THIS_YEAR = now.getFullYear();

  const pad = (n) => String(n).padStart(2, "0");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const yearLabel = (y) => (y < 0 ? { n: String(-y), era: T().bc } : { n: String(y), era: y < 1000 ? T().ad : "" });
  const yearsAgo = (y) => THIS_YEAR - y - (y < 0 ? 1 : 0);
  const daysIn = (m) => [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];

  function applyLang() {
    const t = T();
    document.documentElement.lang = state.lang === "no" ? "nb" : "en";
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t[el.dataset.i18n]));
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t[el.dataset.i18nAria]));
    document.querySelectorAll("#lang [data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    $("footer").innerHTML = t.footer;
  }

  function shift(delta) {
    // Walk the 366-day almanac (Feb 29 included), wrapping at year end.
    let { m, d } = state;
    d += delta;
    if (d < 1) { m = m === 1 ? 12 : m - 1; d = daysIn(m); }
    else if (d > daysIn(m)) { m = m === 12 ? 1 : m + 1; d = 1; }
    go(m, d);
  }

  function go(m, d, { push = true } = {}) {
    state.m = m; state.d = d; state.promoted = null;
    const tag = `${pad(m)}-${pad(d)}`;
    if (push && location.hash.slice(1) !== tag) history.replaceState(null, "", `#${tag}`);
    render();
  }

  async function load(m) {
    if (!cache[m]) {
      cache[m] = fetch(`data/${pad(m)}.json`).then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
    }
    return cache[m];
  }

  // English article title -> { t, url } on Norwegian Wikipedia, or null when
  // there is no Norwegian article. Looked up only when Norwegian is chosen.
  const noArticles = {};
  async function lookupNorwegian(titles) {
    const todo = [...new Set(titles)].filter((t) => !(t in noArticles));
    const chunks = [];
    for (let i = 0; i < todo.length; i += 50) chunks.push(todo.slice(i, i + 50));
    await Promise.all(chunks.map(async (chunk) => {
      const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*" +
        "&redirects=1&prop=langlinks&lllang=no&lllimit=max&llprop=url&titles=" + encodeURIComponent(chunk.join("|"));
      try {
        const q = (await (await fetch(url)).json()).query || {};
        const alias = {};
        for (const r of [...(q.normalized || []), ...(q.redirects || [])]) alias[r.from] = r.to;
        const pages = Object.fromEntries((q.pages || []).map((p) => [p.title, p]));
        for (const t of chunk) {
          let title = t;
          for (let i = 0; i < 3 && alias[title]; i++) title = alias[title];
          const ll = pages[title]?.langlinks?.[0];
          noArticles[t] = ll ? { t: ll.title, url: ll.url } : null;
        }
      } catch {} // Keep the English links; the next render tries again.
    }));
  }
  // Wikipedia links carry data-wt (their English title); data-swap also
  // replaces the link text with the Norwegian title.
  function localizeLinks() {
    document.querySelectorAll("a[data-wt]").forEach((a) => {
      const no = noArticles[a.dataset.wt];
      if (!no) return;
      a.href = no.url;
      a.hreflang = "nb";
      if ("swap" in a.dataset) a.textContent = no.t;
    });
  }

  // Timeline scale: compress deep antiquity so recent centuries get room.
  const f = (y) => -Math.log(2100 - y);
  const X0 = f(-3200), X1 = f(THIS_YEAR + 4);
  const pos = (y) => ((f(y) - X0) / (X1 - X0)) * 100;
  const TICKS = [-3000, -1000, 0, 500, 1000, 1500, 1700, 1800, 1900, 1950, 2000];

  async function render() {
    const { m, d, lang } = state;
    const t = T();
    $("dateText").textContent = t.dateShort(m, d);
    $("dateInput").value = `${THIS_YEAR}-${pad(m)}-${pad(d)}`;
    document.title = `${t.date(m, d)} · Dateline`;

    let day;
    try {
      day = (await load(m))[pad(d)];
    } catch (e) {
      $("status").hidden = false;
      $("status").textContent = t.loadError;
      return;
    }
    if (state.m !== m || state.d !== d || state.lang !== lang) return; // a newer navigation won
    $("status").hidden = true;
    ["heroSec", "rulerSec", "listSec"].forEach((id) => ($(id).hidden = false));

    const events = day.events;
    const topIdx = state.promoted ?? day.top;
    const top = events[topIdx];
    renderHero(top, topIdx === day.top ? day.img : null, m, d, topIdx === day.top);
    renderRuler(events, topIdx);
    renderList(events, topIdx, day.top);

    if (lang === "no") {
      const titles = events.flatMap((e) => (e.main ? [e.main.t] : [])).concat((top.links || []).map((l) => l.t));
      await lookupNorwegian(titles);
      if (state.m === m && state.d === d && state.lang === lang) localizeLinks();
    }
  }

  function renderHero(ev, img, m, d, isPick) {
    const t = T();
    const hero = $("hero");
    hero.classList.remove("hero-in"); void hero.offsetWidth; hero.classList.add("hero-in");
    $("kDate").textContent = t.date(m, d);
    const yl = yearLabel(ev.y);
    $("hYear").innerHTML = `${esc(yl.n)}${yl.era ? `<span class="era">${yl.era}</span>` : ""}`;
    const ago = yearsAgo(ev.y);
    $("hAgo").textContent = ago === 0 ? t.thisYear : t.ago(ago, ago.toLocaleString(t.locale));
    $("hText").textContent = ev.text;
    $("hSubject").innerHTML = ev.main
      ? `<span>${t.read} <a href="${esc(ev.main.url)}" data-wt="${esc(ev.main.t)}" data-swap target="_blank" rel="noopener">${esc(ev.main.t)}</a></span>` +
        (ev.main.desc ? `<span lang="en">${esc(ev.main.desc)}</span>` : "") +
        (ev.score ? `<span>${t.wpLangs(ev.score)}</span>` : "")
      : "";
    $("hLinks").innerHTML = (ev.links || [])
      .map((l) => `<a class="chip" href="${esc(l.url)}" data-wt="${esc(l.t)}" data-swap target="_blank" rel="noopener">${esc(l.t)}</a>`)
      .join("");
    if (img) {
      $("hImg").src = img;
      $("hImg").alt = ev.main ? ev.main.t : "";
      $("hCap").textContent = ev.main ? `${ev.main.t} · Wikimedia Commons` : "Wikimedia Commons";
      $("hPlate").hidden = false;
    } else {
      $("hPlate").hidden = true;
    }
    $("hText").lang = "en";
    $("kNote").textContent = isPick ? t.kickerPick : t.kickerYours;
  }

  function renderRuler(events, topIdx) {
    const t = T();
    const r = $("ruler");
    const maxScore = Math.max(1, ...events.map((e) => e.score));
    let html = '<div class="axis"></div>';
    for (const tick of TICKS) {
      const x = pos(tick);
      const lbl = tick < 0 ? `${-tick} ${t.bc}` : tick === 0 ? t.tickZero : String(tick);
      const edge = x < 4 ? ";transform:none" : x > 96 ? ";transform:translateX(-100%)" : "";
      html += `<div class="tick" style="left:${x}%"></div><div class="tlabel" style="left:${x}%${edge}">${lbl}</div>`;
    }
    events.forEach((e, i) => {
      const h = 8 + Math.round((e.score / maxScore) * 34);
      html += `<button type="button" class="ev${i === topIdx ? " top" : ""}" style="left:${pos(e.y)}%;height:${h}px" data-i="${i}" aria-label="${esc(yearsLabel(e.y))}: ${esc(e.text.slice(0, 90))}" title="${esc(yearsLabel(e.y))} — ${esc(e.text.slice(0, 120))}"></button>`;
    });
    const top = events[topIdx];
    html += `<div class="flag" style="left:${Math.min(96, Math.max(4, pos(top.y)))}%">▼ ${esc(yearsLabel(top.y))}</div>`;
    r.innerHTML = html;
    $("rulerNote").textContent = events.length
      ? t.rulerNote(events.length, yearsLabel(events[0].y), yearsLabel(events[events.length - 1].y))
      : "";
  }
  const yearsLabel = (y) => { const l = yearLabel(y); return l.n + (l.era ? " " + l.era : ""); };

  function renderList(events, topIdx, pickIdx) {
    const t = T();
    const maxScore = Math.max(1, ...events.map((e) => e.score));
    let idx = events.map((_, i) => i);
    if (state.curatedOnly) idx = idx.filter((i) => events[i].sel || i === topIdx);
    if (state.newestFirst) idx.reverse();
    let html = "", lastC = "";
    for (const i of idx) {
      const e = events[i];
      const c = t.century(e.y);
      if (c !== lastC) { html += `<li class="century">${c}</li>`; lastC = c; }
      const yl = yearLabel(e.y);
      const subj = e.main ? `<a href="${esc(e.main.url)}" data-wt="${esc(e.main.t)}" target="_blank" rel="noopener">${esc(e.text)}</a>` : esc(e.text);
      const badge = i === topIdx ? `<span class="badge">★ ${t.headline}</span>` : e.sel ? `<span class="badge" style="color:var(--accent)">${t.curated}</span>` : "";
      const pct = Math.round((e.score / maxScore) * 100);
      html += `<li class="row${i === topIdx ? " is-top" : ""}" id="ev-${i}">
        <div class="y">${esc(yl.n)}${yl.era ? `<small>${yl.era}</small>` : ""}</div>
        <div class="t">${badge}<span lang="en">${subj}</span></div>
        <div class="reach">${e.score ? t.langs(e.score) : "—"}<div class="meter"><i style="width:${pct}%"></i></div>
          ${i !== topIdx ? `<button type="button" class="promote" data-i="${i}">${t.makeHeadline}</button>` : i !== pickIdx ? `<button type="button" class="promote" data-reset="1">${t.restorePick}</button>` : ""}
        </div>
      </li>`;
    }
    $("list").innerHTML = html;
    $("fCurated").setAttribute("aria-pressed", String(state.curatedOnly));
    $("sOld").setAttribute("aria-pressed", String(!state.newestFirst));
    $("sNew").setAttribute("aria-pressed", String(state.newestFirst));
  }

  // Wiring
  $("prev").addEventListener("click", () => shift(-1));
  $("next").addEventListener("click", () => shift(1));
  $("today").addEventListener("click", () => go(now.getMonth() + 1, now.getDate()));
  $("dateInput").addEventListener("change", (e) => {
    const [, m, d] = (e.target.value || "").split("-").map(Number);
    if (m && d) go(m, d);
  });
  $("dateLabel").addEventListener("click", () => {
    try { $("dateInput").showPicker(); } catch {}
  });
  $("lang").addEventListener("click", (e) => {
    const b = e.target.closest("[data-lang]");
    if (!b || b.dataset.lang === state.lang) return;
    state.lang = b.dataset.lang;
    store.set("dl.lang", state.lang);
    applyLang();
    render();
  });
  $("fCurated").addEventListener("click", () => { state.curatedOnly = !state.curatedOnly; store.set("dl.curated", state.curatedOnly ? "1" : "0"); render(); });
  $("sOld").addEventListener("click", () => { state.newestFirst = false; store.set("dl.newest", "0"); render(); });
  $("sNew").addEventListener("click", () => { state.newestFirst = true; store.set("dl.newest", "1"); render(); });
  $("list").addEventListener("click", (e) => {
    const b = e.target.closest(".promote");
    if (!b) return;
    state.promoted = b.dataset.reset ? null : Number(b.dataset.i);
    render().then(() => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
  });
  $("ruler").addEventListener("click", (e) => {
    const b = e.target.closest(".ev");
    if (!b) return;
    let row = $(`ev-${b.dataset.i}`);
    if (!row && state.curatedOnly) { state.curatedOnly = false; render().then(() => flash(b.dataset.i)); return; }
    flash(b.dataset.i);
  });
  function flash(i) {
    const row = $(`ev-${i}`);
    if (!row) return;
    row.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
    row.classList.add("flash");
    setTimeout(() => row.classList.remove("flash"), 1600);
  }
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input")) return;
    if (e.key === "ArrowLeft") shift(-1);
    if (e.key === "ArrowRight") shift(1);
  });
  window.addEventListener("hashchange", () => {
    const t = parseHash();
    if (t && (t.m !== state.m || t.d !== state.d)) go(t.m, t.d, { push: false });
  });
  function parseHash() {
    const m = /^#?(\d{2})-(\d{2})$/.exec(location.hash);
    if (!m) return null;
    const mm = +m[1], dd = +m[2];
    return mm >= 1 && mm <= 12 && dd >= 1 && dd <= daysIn(mm) ? { m: mm, d: dd } : null;
  }

  applyLang();
  const start = parseHash() || { m: now.getMonth() + 1, d: now.getDate() };
  go(start.m, start.d, { push: false });
})();
</script>
</body>
</html>
